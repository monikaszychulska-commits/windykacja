<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Windykacji – Royal Space</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;min-height:100vh;color:#1a1a18}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{background:#fff;border-bottom:1px solid #e8e7e2;padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:52px;position:sticky;top:0;z-index:100}
.nav-logo{font-size:14px;font-weight:500;color:#1a1a18;margin-right:auto}
.nav-logo span{color:#888780;font-weight:400}
.tab{font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;color:#5f5e5a;border:none;background:transparent;transition:background .15s}
.tab:hover{background:#f1efe8}
.tab.active{background:#1a1a18;color:#fff}
.page{display:none;padding:1.5rem;max-width:780px;margin:0 auto}
.page.active{display:block}
.card{background:#fff;border-radius:12px;border:1px solid #e8e7e2;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:13px;font-weight:500;color:#1a1a18;margin-bottom:1rem}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1rem}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11px;color:#888780;font-weight:500}
.f input,.f select{height:36px;border-radius:8px;border:1px solid #d3d1c7;padding:0 10px;font-size:13px;background:#fff;color:#1a1a18;width:100%}
.f input:focus,.f select:focus{outline:none;border-color:#378add;box-shadow:0 0 0 2px #378add22}
.f textarea{border-radius:8px;border:1px solid #d3d1c7;padding:8px 10px;font-size:13px;background:#fff;color:#1a1a18;width:100%;resize:vertical;font-family:inherit}
.btn{height:36px;border-radius:8px;border:1px solid #d3d1c7;padding:0 16px;font-size:13px;cursor:pointer;background:#fff;color:#1a1a18;transition:background .15s}
.btn:hover{background:#f1efe8}
.btn-primary{background:#1a1a18;color:#fff;border-color:#1a1a18}
.btn-primary:hover{background:#2c2c2a}
.btn-sm{height:28px;padding:0 10px;font-size:11px;border-radius:6px}
.btn-danger{border-color:#f09595;color:#a32d2d;background:#fff}
.btn-danger:hover{background:#fcebeb}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.b-ok{background:#e1f5ee;color:#085041}
.b-up{background:#f1efe8;color:#444441}
.b-late{background:#fcebeb;color:#791f1f}
.b-sent{background:#eaf3de;color:#27500a}
.b-ksef{background:#eeedfe;color:#3c3489;font-size:9px}
.inv-list{display:flex;flex-direction:column;gap:8px}
.inv-row{background:#fff;border:1px solid #e8e7e2;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s}
.inv-row:hover{border-color:#b4b2a9}
.inv-ico{width:32px;height:32px;border-radius:50%;background:#f1efe8;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.inv-body{flex:1;min-width:0}
.inv-num{font-size:13px;font-weight:500;color:#1a1a18;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-sub{font-size:11px;color:#888780;margin-top:1px}
.inv-right{text-align:right;flex-shrink:0}
.inv-amt{font-size:13px;font-weight:500;color:#1a1a18}
.inv-due{font-size:11px;color:#888780}
.day-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.day-header h2{font-size:16px;font-weight:500;color:#1a1a18}
.day-counter{font-size:13px;color:#888780}
.action-card{background:#fff;border:1px solid #e8e7e2;border-radius:10px;padding:14px;margin-bottom:10px}
.action-card.ac-done{border-color:#9fe1cb;background:#f8fdfb;opacity:.75}
.action-top{display:flex;align-items:flex-start;gap:10px}
.action-ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ic-warn{background:#faeeda}
.ic-alert{background:#fcebeb}
.ic-info{background:#e6f1fb}
.ic-ext{background:#eeedfe}
.action-body{flex:1;min-width:0}
.action-inv{font-size:13px;font-weight:500;color:#1a1a18}
.action-type{font-size:11px;color:#888780;margin-top:1px}
.action-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.email-block{margin-top:10px;background:#f5f4f0;border-radius:8px;padding:12px}
.email-subject{font-size:12px;font-weight:600;color:#1a1a18;margin-bottom:8px}
.email-text{font-size:12px;color:#1a1a18;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-top:10px;padding-top:10px;border-top:1px solid #e8e7e2}
.copy-btn{margin-top:10px;display:inline-block;height:26px;padding:0 10px;font-size:11px;border-radius:6px;border:1px solid #d3d1c7;background:#fff;cursor:pointer;color:#5f5e5a}
.copy-btn.copied{background:#e1f5ee;color:#085041;border-color:#9fe1cb}
.attach-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.at{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:500}
.at-pdf{background:#faeeda;border:1px solid #efbf6e;color:#7a4400}
.at-ksef{background:#eeedfe;border:1px solid #c5c2f5;color:#3c3489}
.at-scan{background:#fcebeb;border:1px solid #f09595;color:#791f1f}
.at-letter{background:#f1efe8;border:1px solid #d3d1c7;color:#444441}
.udw-info{margin-top:6px;font-size:11px;color:#0c447c;background:#e6f1fb;border:1px solid #c5d9f0;border-radius:6px;padding:4px 9px;display:inline-flex;align-items:center;gap:4px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:1rem}
.stat{background:#f5f4f0;border-radius:8px;padding:10px 12px}
.stat-label{font-size:11px;color:#888780;margin-bottom:3px}
.stat-val{font-size:20px;font-weight:500;color:#1a1a18}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:200;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;border:1px solid #e8e7e2;padding:1.5rem;width:100%;max-width:520px;margin-top:2rem}
.modal h3{font-size:15px;font-weight:500;margin-bottom:1.25rem}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.sep{height:1px;background:#e8e7e2;margin:1rem 0}
.empty-state{text-align:center;padding:3rem 1rem;color:#888780;font-size:13px}
.empty-icon{font-size:32px;margin-bottom:.75rem}
.spinner-wrap{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.8);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.spinner{width:32px;height:32px;border:3px solid #e8e7e2;border-top-color:#1a1a18;border-radius:50%;animation:spin .7s linear infinite}
.spinner-msg{font-size:13px;color:#5f5e5a}
.toast{display:none;position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;font-size:13px;z-index:1000;max-width:420px;text-align:center}
.toast-err{background:#fcebeb;border:1px solid #f09595;color:#791f1f}
.toast-ok{background:#e1f5ee;border:1px solid #9fe1cb;color:#085041}
@media(max-width:480px){.nav{padding:0 1rem}.page{padding:1rem}.form-grid{grid-template-columns:1fr}.modal{margin-top:.5rem}}
</style>
</head>
<body>

<div id="spinner-wrap" class="spinner-wrap">
  <div class="spinner"></div>
  <div class="spinner-msg" id="spinner-msg">Ładowanie...</div>
</div>
<div id="toast" class="toast"></div>

<nav class="nav">
  <div class="nav-logo">Royal Space <span>/ Windykacja</span></div>
  <button class="tab active" id="tab-today" onclick="showPage('today')">Dzisiaj</button>
  <button class="tab" id="tab-invoices" onclick="showPage('invoices')">Faktury</button>
  <button class="tab" id="tab-add" onclick="showPage('add')">+ Dodaj FV</button>
</nav>

<!-- DZISIAJ -->
<div class="page active" id="page-today">
  <div class="day-header">
    <h2 id="today-heading">Zadania na dziś</h2>
    <input type="date" id="day-picker" style="height:32px;border-radius:8px;border:1px solid #d3d1c7;padding:0 8px;font-size:12px;background:#fff;color:#1a1a18" onchange="renderToday()">
    <span class="day-counter" id="today-counter"></span>
  </div>
  <div id="today-content"></div>
</div>

<!-- FAKTURY -->
<div class="page" id="page-invoices">
  <div class="stats-grid" id="stats-grid"></div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">
      <div class="card-title" style="margin:0;flex:1">Wszystkie faktury</div>
      <input type="text" id="search-inv" placeholder="Szukaj..." style="height:30px;border-radius:8px;border:1px solid #d3d1c7;padding:0 10px;font-size:12px;width:160px" oninput="renderInvoiceList()">
    </div>
    <div id="inv-list-container"></div>
  </div>
</div>

<!-- DODAJ FV -->
<div class="page" id="page-add">
  <div class="card">
    <div class="card-title">Dodaj nową fakturę</div>
    <div class="form-grid">
      <div class="f"><label>Numer faktury *</label><input type="text" id="add-num" placeholder="RS/2025/04/001"/></div>
      <div class="f"><label>Kwota (zł) *</label><input type="text" id="add-amt" placeholder="5 000,00"/></div>
      <div class="f"><label>Termin płatności *</label><input type="date" id="add-due"/></div>
      <div class="f"><label>Imię/nazwa klienta *</label><input type="text" id="add-client" placeholder="Jan Kowalski / ABC Sp. z o.o."/></div>
      <div class="f"><label>E-mail klienta</label><input type="email" id="add-email" placeholder="klient@firma.pl"/></div>
      <div class="f"><label>Typ klienta</label>
        <select id="add-type"><option value="osoba">Osoba fizyczna</option><option value="firma">Podmiot gospodarczy</option></select>
      </div>
      <div class="f"><label>KSeF?</label>
        <select id="add-ksef"><option value="0">Nie – załącznik PDF</option><option value="1">Tak – numer KSeF</option></select>
      </div>
      <div class="f"><label>Numer KSeF (jeśli dotyczy)</label><input type="text" id="add-ksef-num" placeholder="PL9999999999-20250427-XXXX"/></div>
      <div class="f"><label>Nieruchomość</label><input type="text" id="add-property" placeholder="np. ul. Kwiatowa 1/5, Kraków"/></div>
      <div class="f"><label>Nazwa Agenta</label><input type="text" id="add-agent" placeholder="np. Anna Kowalska"/></div>
    </div>
    <div class="f" style="margin-bottom:1rem"><label>Notatka (opcjonalnie)</label><textarea id="add-note" rows="2" placeholder="Dodatkowe informacje..."></textarea></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="addInvoice()">Zapisz fakturę</button>
      <button class="btn" onclick="clearAddForm()">Wyczyść</button>
    </div>
    <div id="add-msg" style="margin-top:10px;font-size:12px"></div>
  </div>
</div>

<!-- MODAL szczegóły -->
<div class="overlay" id="inv-modal">
  <div class="modal">
    <h3 id="modal-title">Szczegóły faktury</h3>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" onclick="confirmDelete()">Usuń</button>
      <button class="btn btn-sm" onclick="openEditModal()">Edytuj</button>
      <button class="btn btn-sm" onclick="closeModal()">Zamknij</button>
    </div>
  </div>
</div>

<!-- MODAL edycja -->
<div class="overlay" id="edit-modal">
  <div class="modal" style="max-width:580px">
    <h3>Edytuj fakturę</h3>
    <div class="form-grid">
      <div class="f"><label>Numer faktury *</label><input type="text" id="edit-num"/></div>
      <div class="f"><label>Kwota (zł) *</label><input type="text" id="edit-amt"/></div>
      <div class="f"><label>Termin płatności *</label><input type="date" id="edit-due"/></div>
      <div class="f"><label>Imię/nazwa klienta *</label><input type="text" id="edit-client"/></div>
      <div class="f"><label>E-mail klienta</label><input type="email" id="edit-email"/></div>
      <div class="f"><label>Typ klienta</label>
        <select id="edit-type"><option value="osoba">Osoba fizyczna</option><option value="firma">Podmiot gospodarczy</option></select>
      </div>
      <div class="f"><label>KSeF?</label>
        <select id="edit-ksef"><option value="0">Nie – załącznik PDF</option><option value="1">Tak – numer KSeF</option></select>
      </div>
      <div class="f"><label>Numer KSeF</label><input type="text" id="edit-ksef-num"/></div>
      <div class="f"><label>Nieruchomość</label><input type="text" id="edit-property"/></div>
      <div class="f"><label>Nazwa Agenta</label><input type="text" id="edit-agent"/></div>
    </div>
    <div class="f" style="margin-bottom:1rem"><label>Notatka</label><textarea id="edit-note" rows="2"></textarea></div>
    <div id="edit-msg" style="font-size:12px;min-height:18px;margin-bottom:8px"></div>
    <div class="modal-footer" style="margin-top:0">
      <button class="btn btn-sm" onclick="closeEditModal()">Anuluj</button>
      <button class="btn btn-primary btn-sm" onclick="saveEdit()">Zapisz zmiany</button>
    </div>
  </div>
</div>

<!-- MODAL usuń -->
<div class="overlay" id="delete-modal">
  <div class="modal" style="max-width:400px">
    <h3>Usuń fakturę</h3>
    <p style="font-size:13px;color:#5f5e5a;margin-bottom:1rem">Czy na pewno chcesz usunąć tę fakturę? Tej operacji nie można cofnąć.</p>
    <div id="delete-inv-info" style="background:#f5f4f0;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1rem"></div>
    <div class="modal-footer" style="margin-top:0">
      <button class="btn btn-sm" onclick="closeDeleteModal()">Anuluj</button>
      <button class="btn btn-danger btn-sm" onclick="doDeleteInvoice()">Tak, usuń</button>
    </div>
  </div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbz3e8lqg7VPM7Aa4AdvEeRM1Y5vzKXthUIv5KPdFhb6XV7Piuuu1VhibeynrGs0TF5l0Q/exec';
var selectedInvId = null;

/* ---- UTILS ---- */
function spin(msg) { document.getElementById('spinner-wrap').style.display = 'flex'; document.getElementById('spinner-msg').textContent = msg || 'Ładowanie...'; }
function unspin() { document.getElementById('spinner-wrap').style.display = 'none'; }
function toast(msg, ok) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 4000);
}

function addDays(s, n) { var d = new Date(s); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtPL(s) { if (!s) return '—'; var d = new Date(s); return d.toLocaleDateString('pl-PL', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function fmtDayPL(s) { if (!s) return ''; var d = new Date(s); return d.toLocaleDateString('pl-PL', {weekday:'long'}); }
function isSent(inv, sid) { return !!(inv.sent && inv.sent[sid]); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---- API ---- */
function api(params, cb) {
  var qs = Object.keys(params).map(function(k) {
    var v = typeof params[k] === 'object' ? JSON.stringify(params[k]) : params[k];
    return encodeURIComponent(k) + '=' + encodeURIComponent(v);
  }).join('&');
  fetch(API + '?' + qs)
    .then(function(r) { return r.json(); })
    .then(function(d) { unspin(); cb(null, d); })
    .catch(function(e) { unspin(); toast('Błąd połączenia: ' + e.message); cb(e, null); });
}

function loadAll(cb) {
  spin('Pobieranie faktur...');
  api({action: 'getAll'}, function(err, d) {
    if (err || !d) { cb([]); return; }
    if (d.error) { toast('Błąd: ' + d.error); cb([]); return; }
    cb(d.invoices || []);
  });
}

/* ---- SCHEDULE ---- */
function getSched(inv) {
  var due = inv.due;
  return [
    {id:'issue', date: inv.created || todayISO(), label:'Wystawienie i wysyłka FV',    icon:'📄', icCls:'ic-info',  ek: null},
    {id:'pre',   date: addDays(due, -2),           label:'Przypomnienie (2 dni przed)', icon:'🔔', icCls:'ic-info',  ek: 'pre'},
    {id:'due',   date: due,                        label:'Termin płatności',            icon:'📅', icCls:'ic-info',  ek: null},
    {id:'p7',    date: addDays(due, 7),            label:'Wezwanie do zapłaty',         icon:'⚠️', icCls:'ic-warn',  ek: 'p7'},
    {id:'p21',   date: addDays(due, 21),           label:'Ostateczne wezwanie',         icon:'🚨', icCls:'ic-alert', ek: 'p21'},
    {id:'p30',   date: addDays(due, 30),           label:'Windykacja zewnętrzna',       icon:'⚖️', icCls:'ic-ext',   ek: 'p30'},
  ];
}

/* ---- EMAIL ---- */
function getSubject(inv, key) {
  var ref = inv.ksef === '1' ? 'KSeF: ' + inv.ksefNum : 'FV nr ' + inv.num;
  var map = {
    pre:  'Przypomnienie o płatności – ' + ref,
    p7:   'Wezwanie do zapłaty – ' + ref,
    p21:  'Ostateczne wezwanie do zapłaty – ' + ref,
    p30:  'Przekazanie do windykacji zewnętrznej – ' + ref
  };
  return map[key] || '';
}

function getAttachments(inv, key) {
  var isKsef = inv.ksef === '1';
  var ksefTag = {l: 'Nr KSeF: ' + inv.ksefNum, c: 'at-ksef'};
  var pdfTag  = {l: '📎 Faktura PDF', c: 'at-pdf'};
  var pdf2Tag = {l: '📎 Faktura PDF (ponownie)', c: 'at-pdf'};
  var scanTag = {l: '📎 Skan wezwania z pieczątką', c: 'at-scan'};
  var preTag  = {l: '📎 Przedsądowe wezwanie (skan)', c: 'at-scan'};
  var letTag  = {l: '✉ List polecony', c: 'at-letter'};
  var map = {
    pre:  isKsef ? [ksefTag]               : [pdfTag],
    p7:   isKsef ? [ksefTag]               : [pdf2Tag],
    p21:  isKsef ? [ksefTag, scanTag]      : [pdf2Tag, scanTag],
    p30:  isKsef ? [ksefTag, preTag, letTag] : [preTag, letTag]
  };
  return map[key] || [];
}

function getUDWline(inv) {
  if (inv.type !== 'osoba') return '';
  return '📋 UDW: ' + (inv.agent || '[Nazwa Agenta]');
}

function getBody(inv, key) {
  var isKsef   = inv.ksef === '1';
  var fvRef    = isKsef ? 'o numerze KSeF: ' + inv.ksefNum : 'nr ' + inv.num;
  var prop     = inv.property ? ' dotyczącej nieruchomości ' + inv.property : '';
  var att1     = isKsef ? 'Numer KSeF faktury: ' + inv.ksefNum + '.' : 'Fakturę przesyłamy w załączeniu.';
  var att2     = isKsef ? 'Numer KSeF faktury: ' + inv.ksefNum + '.' : 'Fakturę przesyłamy ponownie w załączeniu.';

  var bodies = {
    pre: 'Dzień dobry,\n\n'
       + 'przypominamy, że za 2 dni przypada termin płatności faktury ' + fvRef + prop + ' na kwotę ' + inv.amt + ' zł. ' + att1 + '\n\n'
       + 'Jeśli Państwo już opłacili fakturę, prosimy o zignorowanie tej wiadomości.\n\n'
       + 'Pozdrawiamy,\nZespół Royal Space',

    p7:  'Dzień dobry,\n\n'
       + 'informujemy, że 7 dni temu minął termin płatności za fakturę ' + fvRef + prop + ' na kwotę ' + inv.amt + ' zł. ' + att2 + '\n\n'
       + 'Prosimy o pilne uregulowanie zaległości. W przypadku opłacenia prosimy o zignorowanie wiadomości.\n\n'
       + 'Pozdrawiamy,\nZespół Royal Space',

    p21: 'Dzień dobry,\n\n'
       + 'informujemy, że minął termin płatności za fakturę ' + fvRef + prop + ' na kwotę ' + inv.amt + ' zł. ' + att2 + '\n\n'
       + 'Prosimy o pilne uregulowanie zaległości w terminie 5 dni roboczych od otrzymania wezwania. W przeciwnym razie zaległość zostanie skierowana do windykacji zewnętrznej.\n\n'
       + 'Jeżeli faktura została już opłacona, prosimy o zignorowanie wiadomości.\n\n'
       + 'Z poważaniem,\nZespół Royal Space',

    p30: 'Dzień dobry,\n\n'
       + 'pomimo wcześniejszych wezwań, do dnia dzisiejszego nie odnotowaliśmy płatności za fakturę ' + fvRef + prop + ' na kwotę ' + inv.amt + ' zł.\n\n'
       + 'Niniejszym informujemy, że sprawa zostaje przekazana do windykacji zewnętrznej.\n\n'
       + '[Treść do uzupełnienia przez Agnieszkę]\n\n'
       + 'Z poważaniem,\nZespół Royal Space'
  };
  return bodies[key] || '';
}

/* ---- PAGES ---- */
function showPage(name) {
  ['today', 'invoices', 'add'].forEach(function(p) {
    document.getElementById('page-' + p).classList.remove('active');
    document.getElementById('tab-' + p).classList.remove('active');
  });
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'today') renderToday();
  if (name === 'invoices') { renderStats(); renderInvoiceList(); }
}

/* ---- TODAY ---- */
function renderToday() {
  var picker = document.getElementById('day-picker');
  var dateStr = picker.value || todayISO();
  if (!picker.value) picker.value = dateStr;
  document.getElementById('today-heading').textContent = dateStr === todayISO() ? 'Zadania na dziś' : 'Zadania na ' + fmtPL(dateStr);
  document.getElementById('today-content').innerHTML = '<div class="empty-state"><div>Ładowanie...</div></div>';

  loadAll(function(invoices) {
    var actions = [];
    invoices.forEach(function(inv) {
      if (inv.paid) return;
      getSched(inv).forEach(function(step) {
        if (step.date === dateStr && step.ek) actions.push({inv: inv, step: step});
      });
    });

    var unsent = actions.filter(function(a) { return !isSent(a.inv, a.step.id); });
    document.getElementById('today-counter').textContent = actions.length === 0 ? '' : unsent.length + ' do wysłania · ' + actions.length + ' łącznie';

    var cont = document.getElementById('today-content');
    if (!actions.length) {
      cont.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><div>Brak zadań na ten dzień.</div></div>';
      return;
    }

    var html = '';
    actions.forEach(function(a) {
      var inv = a.inv;
      var step = a.step;
      var sent = isSent(inv, step.id);
      var uid = inv.id + '_' + step.id;
      var subj = getSubject(inv, step.ek);
      var body = getBody(inv, step.ek);
      var attaches = getAttachments(inv, step.ek);
      var udwLine = getUDWline(inv);

      html += '<div class="action-card' + (sent ? ' ac-done' : '') + '">';
      html += '<div class="action-top">';
      html += '<div class="action-ico ' + step.icCls + '">' + step.icon + '</div>';
      html += '<div class="action-body">';
      html += '<div class="action-inv">' + inv.num + (inv.ksef === '1' ? '<span class="badge b-ksef" style="margin-left:5px">KSeF</span>' : '') + ' · ' + inv.client + '</div>';
      html += '<div class="action-type">' + step.label + ' · ' + inv.amt + ' zł · termin: ' + fmtPL(inv.due) + (inv.property ? ' · ' + inv.property : '') + '</div>';
      if (inv.email) html += '<div style="font-size:11px;color:#378add;margin-top:2px">' + inv.email + '</div>';
      html += '</div></div>';

      html += '<div class="action-actions">';
      if (sent) {
        html += '<span class="badge b-sent">✓ Wysłano</span>';
        html += '<button class="btn btn-sm" onclick="markSent(\'' + inv.id + '\',\'' + step.id + '\',false)">Cofnij</button>';
      } else {
        html += '<button class="btn btn-primary btn-sm" onclick="markSent(\'' + inv.id + '\',\'' + step.id + '\',true)">✓ Oznacz jako wysłany</button>';
      }
      html += '</div>';

      if (body && !sent) {
        html += '<div class="email-block">';
        html += '<div class="email-subject">📧 Temat: ' + subj + '</div>';
        if (udwLine) html += '<div class="udw-info">' + udwLine + '</div>';
        if (attaches.length) {
          html += '<div class="attach-row">';
          attaches.forEach(function(at) { html += '<span class="at ' + at.c + '">' + at.l + '</span>'; });
          html += '</div>';
        }
        html += '<div class="email-text">' + body + '</div>';
        html += '<button class="copy-btn" id="copy-' + uid + '" onclick="doCopy(\'' + uid + '\')">Kopiuj temat + treść</button>';
        html += '</div>';

        // Store data for copy
        window['_email_' + uid] = {subj: subj, body: body};
      }

      html += '</div>';
    });
    cont.innerHTML = html;
  });
}

function doCopy(uid) {
  var data = window['_email_' + uid];
  if (!data) return;
  var full = 'Temat: ' + data.subj + '\n\n' + data.body;
  navigator.clipboard.writeText(full).then(function() { flashCopy(uid); }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = full;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    flashCopy(uid);
  });
}

function flashCopy(uid) {
  var btn = document.getElementById('copy-' + uid);
  if (btn) {
    btn.textContent = 'Skopiowano!';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = 'Kopiuj temat + treść'; btn.classList.remove('copied'); }, 2000);
  }
}

function markSent(invId, stepId, val) {
  spin('Zapisywanie...');
  loadAll(function(invoices) {
    var inv = invoices.find(function(i) { return i.id === invId; });
    if (!inv) { unspin(); return; }
    if (!inv.sent) inv.sent = {};
    inv.sent[stepId] = val;
    api({action: 'update', data: inv}, function(err, d) {
      if (d && d.error) toast('Błąd: ' + d.error);
      else toast(val ? 'Oznaczono jako wysłany' : 'Cofnięto oznaczenie', true);
      renderToday();
    });
  });
}

/* ---- STATS ---- */
function renderStats() {
  loadAll(function(invoices) {
    var today = todayISO();
    var paid = invoices.filter(function(i) { return i.paid; }).length;
    var overdue = invoices.filter(function(i) { return i.due < today && !i.paid; }).length;
    document.getElementById('stats-grid').innerHTML =
      '<div class="stat"><div class="stat-label">Wszystkie FV</div><div class="stat-val">' + invoices.length + '</div></div>' +
      '<div class="stat"><div class="stat-label">Aktywne</div><div class="stat-val">' + (invoices.length - paid) + '</div></div>' +
      '<div class="stat"><div class="stat-label">Po terminie</div><div class="stat-val" style="color:#a32d2d">' + overdue + '</div></div>' +
      '<div class="stat"><div class="stat-label">Opłacone</div><div class="stat-val" style="color:#085041">' + paid + '</div></div>';
  });
}

/* ---- INVOICE LIST ---- */
function renderInvoiceList() {
  var q = (document.getElementById('search-inv').value || '').toLowerCase();
  document.getElementById('inv-list-container').innerHTML = '<div style="padding:1rem;color:#888780;font-size:13px">Ładowanie...</div>';
  loadAll(function(invoices) {
    if (q) invoices = invoices.filter(function(i) { return (i.num + i.client + i.amt + (i.property||'')).toLowerCase().indexOf(q) > -1; });
    var cont = document.getElementById('inv-list-container');
    if (!invoices.length) { cont.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><div>Brak faktur.</div></div>'; return; }
    invoices.sort(function(a, b) { return a.due > b.due ? 1 : -1; });
    var today = todayISO();
    var html = '<div class="inv-list">';
    invoices.forEach(function(inv) {
      var overdue = inv.due < today && !inv.paid;
      var bc = inv.paid ? 'b-sent' : overdue ? 'b-late' : 'b-up';
      var bt = inv.paid ? 'Opłacona' : overdue ? 'Po terminie' : 'Aktywna';
      html += '<div class="inv-row" onclick="openModal(\'' + inv.id + '\')">';
      html += '<div class="inv-ico">' + (inv.paid ? '✅' : '📄') + '</div>';
      html += '<div class="inv-body"><div class="inv-num">' + inv.num + (inv.ksef === '1' ? '<span class="badge b-ksef" style="margin-left:5px">KSeF</span>' : '') + '</div>';
      html += '<div class="inv-sub">' + inv.client + (inv.property ? ' · ' + inv.property : '') + ' · <span class="badge ' + bc + '">' + bt + '</span></div></div>';
      html += '<div class="inv-right"><div class="inv-amt">' + inv.amt + ' zł</div><div class="inv-due">Termin: ' + fmtPL(inv.due) + '</div></div>';
      html += '</div>';
    });
    cont.innerHTML = html + '</div>';
  });
}

/* ---- MODAL DETAILS ---- */
function openModal(id) {
  selectedInvId = id;
  spin('Pobieranie...');
  loadAll(function(invoices) {
    var inv = invoices.find(function(i) { return i.id === id; });
    if (!inv) { unspin(); return; }
    document.getElementById('modal-title').textContent = inv.num + ' – ' + inv.client;
    var today = todayISO();
    var sc = getSched(inv);
    var html = '<div class="form-grid" style="margin-bottom:1rem">';
    html += '<div class="f"><label>Kwota</label><div style="font-size:13px;padding:4px 0;font-weight:500">' + inv.amt + ' zł</div></div>';
    html += '<div class="f"><label>Termin płatności</label><div style="font-size:13px;padding:4px 0">' + fmtPL(inv.due) + ' (' + fmtDayPL(inv.due) + ')</div></div>';
    html += '<div class="f"><label>E-mail klienta</label><div style="font-size:13px;padding:4px 0">' + (inv.email || '—') + '</div></div>';
    html += '<div class="f"><label>KSeF</label><div style="font-size:13px;padding:4px 0">' + (inv.ksef === '1' ? 'Tak (' + inv.ksefNum + ')' : 'Nie') + '</div></div>';
    if (inv.property) html += '<div class="f"><label>Nieruchomość</label><div style="font-size:13px;padding:4px 0">' + inv.property + '</div></div>';
    if (inv.agent) html += '<div class="f"><label>Agent</label><div style="font-size:13px;padding:4px 0">' + inv.agent + '</div></div>';
    html += '</div>';
    if (inv.note) html += '<div style="font-size:12px;color:#888780;margin-bottom:1rem;padding:8px 10px;background:#f5f4f0;border-radius:8px">' + inv.note + '</div>';
    html += '<div class="sep"></div>';
    html += '<div style="font-size:12px;font-weight:500;color:#888780;margin-bottom:8px">Harmonogram</div>';
    html += '<div style="display:flex;flex-direction:column;gap:6px">';
    sc.forEach(function(step) {
      var past = step.date < today, isT = step.date === today, sent = isSent(inv, step.id);
      var bg = isT ? '#f5f9fe' : (past && !sent && step.ek) ? '#fef8f8' : '#fff';
      var border = isT ? '#378add' : (past && !sent && step.ek) ? '#f09595' : '#e8e7e2';
      html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid ' + border + ';background:' + bg + '">';
      html += '<span>' + step.icon + '</span><div style="flex:1;font-size:12px;font-weight:500">' + step.label + '</div>';
      html += '<div style="font-size:11px;color:#888780">' + fmtPL(step.date) + '</div>';
      if (step.ek) html += sent ? '<span class="badge b-sent">✓</span>' : (isT || past) ? '<span class="badge b-late">!</span>' : '<span class="badge b-up">–</span>';
      html += '</div>';
    });
    html += '</div><div class="sep"></div><div style="display:flex;gap:8px;flex-wrap:wrap">';
    if (!inv.paid) {
      html += '<button class="btn btn-sm" style="background:#e1f5ee;border-color:#9fe1cb;color:#085041" onclick="markPaid(\'' + id + '\')">✓ Oznacz jako opłaconą</button>';
    } else {
      html += '<span class="badge b-sent" style="font-size:12px;padding:4px 10px">✓ Opłacona</span>';
      html += '<button class="btn btn-sm" onclick="markPaid(\'' + id + '\')">Cofnij</button>';
    }
    html += '</div>';
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('inv-modal').classList.add('open');
  });
}

function closeModal() { document.getElementById('inv-modal').classList.remove('open'); selectedInvId = null; }

function markPaid(id) {
  spin('Zapisywanie...');
  loadAll(function(invoices) {
    var inv = invoices.find(function(i) { return i.id === id; });
    if (!inv) { unspin(); return; }
    inv.paid = !inv.paid;
    api({action: 'update', data: inv}, function(err, d) {
      if (d && d.error) toast('Błąd: ' + d.error);
      else toast(inv.paid ? 'Oznaczono jako opłaconą' : 'Cofnięto opłacenie', true);
      closeModal(); renderStats(); renderInvoiceList();
    });
  });
}

/* ---- EDIT ---- */
function openEditModal() {
  if (!selectedInvId) return;
  spin('Pobieranie...');
  loadAll(function(invoices) {
    var inv = invoices.find(function(i) { return i.id === selectedInvId; });
    if (!inv) { unspin(); return; }
    document.getElementById('edit-num').value = inv.num || '';
    document.getElementById('edit-amt').value = inv.amt || '';
    document.getElementById('edit-due').value = inv.due || '';
    document.getElementById('edit-client').value = inv.client || '';
    document.getElementById('edit-email').value = inv.email || '';
    document.getElementById('edit-type').value = inv.type || 'osoba';
    document.getElementById('edit-ksef').value = inv.ksef || '0';
    document.getElementById('edit-ksef-num').value = inv.ksefNum || '';
    document.getElementById('edit-property').value = inv.property || '';
    document.getElementById('edit-agent').value = inv.agent || '';
    document.getElementById('edit-note').value = inv.note || '';
    document.getElementById('edit-msg').innerHTML = '';
    document.getElementById('inv-modal').classList.remove('open');
    document.getElementById('edit-modal').classList.add('open');
  });
}

function closeEditModal() { document.getElementById('edit-modal').classList.remove('open'); if (selectedInvId) openModal(selectedInvId); }

function saveEdit() {
  var num = document.getElementById('edit-num').value.trim();
  var amt = document.getElementById('edit-amt').value.trim();
  var due = document.getElementById('edit-due').value;
  var client = document.getElementById('edit-client').value.trim();
  var msg = document.getElementById('edit-msg');
  if (!num || !amt || !due || !client) { msg.innerHTML = '<span style="color:#a32d2d">Uzupełnij wymagane pola.</span>'; return; }
  spin('Zapisywanie...');
  loadAll(function(invoices) {
    var inv = invoices.find(function(i) { return i.id === selectedInvId; });
    if (!inv) { unspin(); return; }
    inv.num = num; inv.amt = amt; inv.due = due; inv.client = client;
    inv.email = document.getElementById('edit-email').value.trim();
    inv.type = document.getElementById('edit-type').value;
    inv.ksef = document.getElementById('edit-ksef').value;
    inv.ksefNum = document.getElementById('edit-ksef-num').value.trim();
    inv.property = document.getElementById('edit-property').value.trim();
    inv.agent = document.getElementById('edit-agent').value.trim();
    inv.note = document.getElementById('edit-note').value.trim();
    api({action: 'update', data: inv}, function(err, d) {
      if (d && d.error) { toast('Błąd: ' + d.error); return; }
      toast('Zapisano zmiany', true);
      document.getElementById('edit-modal').classList.remove('open');
      openModal(selectedInvId);
    });
  });
}

/* ---- DELETE ---- */
function confirmDelete() {
  if (!selectedInvId) return;
  spin('Pobieranie...');
  loadAll(function(invoices) {
    var inv = invoices.find(function(i) { return i.id === selectedInvId; });
    if (!inv) { unspin(); return; }
    document.getElementById('delete-inv-info').innerHTML = '<strong>' + inv.num + '</strong> · ' + inv.client + '<br><span style="color:#888780">Kwota: ' + inv.amt + ' zł · Termin: ' + fmtPL(inv.due) + '</span>';
    document.getElementById('inv-modal').classList.remove('open');
    document.getElementById('delete-modal').classList.add('open');
  });
}
function closeDeleteModal() { document.getElementById('delete-modal').classList.remove('open'); if (selectedInvId) openModal(selectedInvId); }
function doDeleteInvoice() {
  if (!selectedInvId) return;
  var id = selectedInvId;
  spin('Usuwanie...');
  api({action: 'delete', id: id}, function(err, d) {
    if (d && d.error) { toast('Błąd: ' + d.error); return; }
    toast('Faktura usunięta', true);
    document.getElementById('delete-modal').classList.remove('open');
    selectedInvId = null;
    renderStats(); renderInvoiceList(); renderToday();
  });
}

/* ---- ADD ---- */
function addInvoice() {
  var num = document.getElementById('add-num').value.trim();
  var amt = document.getElementById('add-amt').value.trim();
  var due = document.getElementById('add-due').value;
  var client = document.getElementById('add-client').value.trim();
  var msg = document.getElementById('add-msg');
  if (!num || !amt || !due || !client) { msg.innerHTML = '<span style="color:#a32d2d">Uzupełnij wymagane pola (*).</span>'; return; }
  spin('Sprawdzanie...');
  loadAll(function(invoices) {
    if (invoices.find(function(i) { return i.num === num; })) {
      unspin();
      msg.innerHTML = '<span style="color:#a32d2d">Faktura o tym numerze już istnieje.</span>';
      return;
    }
    var inv = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      num: num, amt: amt, due: due, client: client,
      email: document.getElementById('add-email').value.trim(),
      type: document.getElementById('add-type').value,
      ksef: document.getElementById('add-ksef').value,
      ksefNum: document.getElementById('add-ksef-num').value.trim(),
      property: document.getElementById('add-property').value.trim(),
      agent: document.getElementById('add-agent').value.trim(),
      note: document.getElementById('add-note').value.trim(),
      created: todayISO(), sent: {}, paid: false
    };
    api({action: 'save', data: inv}, function(err, d) {
      if (d && d.error) { toast('Błąd: ' + d.error); return; }
      toast('Faktura zapisana w Google Sheets!', true);
      clearAddForm();
      setTimeout(function() { showPage('today'); }, 1200);
    });
  });
}

function clearAddForm() {
  ['add-num','add-amt','add-due','add-client','add-email','add-ksef-num','add-property','add-agent','add-note'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('add-type').value = 'osoba';
  document.getElementById('add-ksef').value = '0';
  document.getElementById('add-msg').innerHTML = '';
}

/* ---- MODAL CLOSE ON BG ---- */
document.getElementById('inv-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.getElementById('edit-modal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
document.getElementById('delete-modal').addEventListener('click', function(e) { if (e.target === this) closeDeleteModal(); });

/* ---- INIT ---- */
document.getElementById('day-picker').value = todayISO();
renderToday();
</script>
